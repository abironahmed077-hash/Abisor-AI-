name: Make keystore

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair -v \
            -keystore abisor.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias abisor \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Abisor AI, O=Abisor, C=BD"
          base64 -w 0 abisor.keystore > keystore_base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: abisor-keystore
          path: |
            abisor.keystore
            keystore_base64.txt
          retention-days: 1
