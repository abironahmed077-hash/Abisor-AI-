name: Get SHA1

on:
  workflow_dispatch:

jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > abisor.keystore

      - name: Show SHA1
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: keytool -list -v -keystore abisor.keystore -alias abisor -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1|SHA256"
