<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abisor ai</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f2f4f7; height: 100vh; display: flex; flex-direction: column; }
  header { background: #006a4e; color: #fff; padding: 12px 16px; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; margin: 6px 0; line-height: 1.5; white-space: pre-wrap; }
  .bot { background: #fff; align-self: flex-start; }
  .me { background: #d1f0e4; margin-left: auto; }
  .row { display: flex; flex-direction: column; }
  .msg svg { width: 100%; max-width: 260px; display: block; }
  form { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
  input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
  button { padding: 10px 16px; background: #006a4e; color: #fff; border: 0; border-radius: 8px; font-size: 16px; }
</style>
</head>
<body>
<header>abisor ai</header>
<div id="chat" class="row"></div>
<form id="f">
  <input id="q" placeholder="কিছু লিখুন..." autocomplete="off">
  <button type="submit">পাঠান</button>
</form>
<script>
const FLAG = `<svg viewBox="0 0 300 180" xmlns="http://www.w3.org/2000/svg"><rect width="300" height="180" fill="#006a4e"/><circle cx="120" cy="90" r="50" fill="#f42a41"/></svg>`;

const RULES = [
  { k: ["কেমন আছো", "কেমন আছ", "কেমন আছেন", "কি খবর", "কী খবর"],
    a: "আমি ভালো আছি, সবাই ভালো আছে। আপনি কেমন আছেন?" },
  { k: ["ধন্যবাদ", "thanks"], a: "আপনাকেও ধন্যবাদ!" },
  { k: ["হ্যালো", "হাই", "assalamu", "আসসালামু", "সালাম"], a: "আসসালামু আলাইকুম! কী জানতে চান?" },
  { k: ["ভাষা আন্দোলন", "একুশে", "২১ ফেব্রুয়ারি", "21 february"],
    a: "১৯৫২ সালের ২১ ফেব্রুয়ারি বাংলাকে রাষ্ট্রভাষা করার দাবিতে ঢাকায় ছাত্ররা আন্দোলন করেন। পুলিশের গুলিতে কয়েকজন শহীদ হন। এই দিনকে ইউনেসকো ২০০০ সাল থেকে আন্তর্জাতিক মাতৃভাষা দিবস হিসেবে পালন করে।" },
  { k: ["৭ মার্চ", "৭ই মার্চ", "সাত মার্চ", "ভাষণ"],
    a: "১৯৭১ সালের ৭ মার্চ ঢাকার রেসকোর্স ময়দানে বঙ্গবন্ধু শেখ মুজিবুর রহমান ঐতিহাসিক ভাষণ দেন। সেখানে তিনি স্বাধীনতার জন্য সংগ্রামের ডাক দেন।" },
  { k: ["২৬ মার্চ", "স্বাধীনতা দিবস", "স্বাধীনতা"],
    a: "১৯৭১ সালের ২৬ মার্চ বাংলাদেশের স্বাধীনতা ঘোষণা করা হয়। এরপর নয় মাসের মুক্তিযুদ্ধ শুরু হয়।" },
  { k: ["১৬ ডিসেম্বর", "বিজয় দিবস", "বিজয়"],
    a: "১৯৭১ সালের ১৬ ডিসেম্বর পাকিস্তানী বাহিনী ঢাকায় আত্মসমর্পণ করে। এদিন বাংলাদেশে বিজয় দিবস হিসেবে পালিত হয়।" },
  { k: ["মুক্তিযুদ্ধ"],
    a: "১৯৭১ সালের ২৬ মার্চ থেকে ১৬ ডিসেম্বর পর্যন্ত নয় মাস ধরে মুক্তিযুদ্ধ চলে। এতে বহু মানুষ প্রাণ দেন।" },
  { k: ["জাতীয় সংগীত", "আমার সোনার বাংলা"],
    a: "আমাদের জাতীয় সংগীত 'আমার সোনার বাংলা'। এটি রবীন্দ্রনাথ ঠাকুরের লেখা।" },
  { k: ["পতাকা", "flag"],
    a: "বাংলাদেশের জাতীয় পতাকা সবুজ জমিনের মাঝখানে লাল বৃত্ত। সবুজ অংশ বাংলার সবুজ প্রকৃতি এবং লাল বৃত্ত উদীয়মান সূর্য ও স্বাধীনতার প্রতীক।\n" + FLAG },
  { k: ["গ্রাফিক্স", "ছবি", "আঁকো", "আঁক"],
    a: "আমি সহজ ছবি বা চিহ্ন বানাতে পারি। এখন একটা নমুনা দেখুন:\n" + FLAG },
];

function reply(text) {
  const t = text.toLowerCase();
  for (const r of RULES) {
    if (r.k.some(w => t.includes(w.toLowerCase()))) return r.a;
  }
  return "দুঃখিত, এটা এখনো আমি শিখিনি। অন্যভাবে জিজ্ঞেস করে দেখুন, যেমন ইতিহাস, মুক্তিযুদ্ধ, বা কুশলাদি।";
}

const chat = document.getElementById("chat");
function add(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  if (who === "bot" && text.includes("<svg")) {
    const parts = text.split("<svg");
    d.innerHTML = parts[0].replace(/</g, "&lt;") + "<svg" + parts.slice(1).join("<svg");
  } else {
    d.textContent = text;
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

add("আসসালামু আলাইকুম! আমি abisor ai। কুশলাদি, বাংলাদেশের ইতিহাস, বা সহজ গ্রাফিক্স নিয়ে কথা বলতে পারি।", "bot");

document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("q");
  const text = q.value.trim();
  if (!text) return;
  add(text, "me");
  q.value = "";
  setTimeout(() => add(reply(text), "bot"), 300);
});
</script>
</body>
  </html>
